[package]
name = "c3avcompressor"
version = "0.1.0"
edition = "2021"
authors = ["C3net Development"]
description = "C3.AVcompressor - High-performance AI/NPU accelerated Audio/Video Compressor, Splitter & Extractor"
license = "MIT OR Apache-2.0"

[lib]
name = "c3avcompressor"
path = "src/lib.rs"

[[bin]]
name = "c3avcompressor"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo", "env"] }
clap_complete = "4.5"
indicatif = { version = "0.17", features = ["rayon"] }
colored = "3.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
rayon = "1.10"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1.11"
sysinfo = "0.33"
chrono = "0.4"
tempfile = "3.17"
num_cpus = "1.16"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
